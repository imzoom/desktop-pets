name: Build Standalone Desktop Pet (Windows x64)

on:
  push:
    branches: [ develop, main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Standalone Single-File Executable (Self-Contained)
      run: |
        dotnet publish desktop-pet-win/DesktopPet.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o release/DesktopPet-Standalone-win-x64

    - name: Package Standalone Zip
      run: |
        Compress-Archive -Path "release/DesktopPet-Standalone-win-x64/*" -DestinationPath "release/DesktopPet-Standalone-Win64.zip" -Force

    - name: Upload Artifact (Direct Download for Users)
      uses: actions/upload-artifact@v4
      with:
        name: DesktopPet-Standalone-Win64
        path: release/DesktopPet-Standalone-Win64.zip
        retention-days: 90

    - name: Create GitHub Release (On Tags)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: release/DesktopPet-Standalone-Win64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
